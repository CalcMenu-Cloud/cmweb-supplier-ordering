

  
 <div class="card">
    <div class="card-header">
  
      <h5 class="card-title">{{title}}</h5>
    </div>
    <div class="card-body">
      <p [innerHTML]="message"></p>
    </div>
    <div class="card-footer d-flex justify-content-end">
      <button type="button"  class="btn btn-primary"  style="min-width: 136.5px;" (click)="close()">Ok</button>   
    </div>
  </div>
