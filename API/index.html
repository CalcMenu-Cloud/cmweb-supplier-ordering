<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Animation</title>
    <style>
        /* Style for the logo container */
        .logo-container {
            width: 300px;
            height: 150px;
            margin: auto;
            position: relative;
            overflow: hidden;
        }

        /* Animation for the logo */
        .logo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            animation: slide 5s infinite;
        }

        /* Keyframes for the animation */
        @keyframes slide {
            0% {
                transform: translateY(-100%);
            }

            100% {
                transform: translateY(100%);
            }
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <!-- Replace the src attribute with the URL of the logo -->
        <img class="logo" src="https://www.calcmenu.com/assets/img/CalcMenu%20Logo.svg" alt="CalcMenu Logo">
    </div>
</body>
</html>
